<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 01 Boek en baken: an open songbook broadcasting a Bluetooth beacon -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13315C"/>
      <stop offset="1" stop-color="#0B2545"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- signal arcs -->
  <g fill="none" stroke="#4FC3F7" stroke-width="16" stroke-linecap="round">
    <path d="M150 150 A110 110 0 0 0 150 290"/>
    <path d="M110 112 A165 165 0 0 0 110 328" opacity="0.5"/>
    <path d="M362 150 A110 110 0 0 1 362 290"/>
    <path d="M402 112 A165 165 0 0 1 402 328" opacity="0.5"/>
  </g>
  <!-- bluetooth rune -->
  <path d="M256 100 L256 340 M214 142 L298 298 L256 340 M214 298 L298 142 L256 100"
        fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- open book -->
  <path d="M86 372 Q171 342 256 372 L256 448 Q171 418 86 448 Z" fill="#FFF4E0"/>
  <path d="M426 372 Q341 342 256 372 L256 448 Q341 418 426 448 Z" fill="#FFE9C2"/>
  <path d="M256 372 L256 448" stroke="#B8894E" stroke-width="6"/>
  <g stroke="#C9A978" stroke-width="7" stroke-linecap="round">
    <path d="M118 392 Q186 376 236 392"/>
    <path d="M118 416 Q186 400 236 416"/>
    <path d="M276 392 Q326 376 394 392"/>
    <path d="M276 416 Q326 400 394 416"/>
  </g>
  <!-- singing note on the right page -->
  <g fill="#FF8A3D">
    <ellipse cx="344" cy="434" rx="16" ry="11" transform="rotate(-20 344 434)"/>
    <rect x="356" y="384" width="7" height="50" rx="3"/>
    <path d="M363 384 q26 10 18 34 q-4-14-18-16 z"/>
  </g>
</svg>
