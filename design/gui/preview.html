<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backdrop preview</title>
<style>
  :root { --night: #0B2545; --orange: #FF8A3D; --offwhite: #CFE6FF; }
  body { margin: 0; padding: 24px; background: #202020; color: #ddd; font-family: Roboto, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: #aaa; margin-top: 6px; }
  .frame { position: relative; overflow: hidden; background: #000; border-radius: 18px; box-shadow: 0 0 0 2px #444; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  /* D-14: #0B2545 at 60 % top to #000 at 75 % bottom */
  .scrim { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(11,37,69,0.60), rgba(0,0,0,0.75)); }
  .ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 8% 6%; box-sizing: border-box; color: #fff; }
  .title { font-size: 2.2em; font-weight: 700; }
  .version { color: var(--offwhite); font-size: 1em; margin-top: 0.3em; }
  .panel { background: rgba(11,37,69,0.85); color: #fff; padding: 0.8em 1em; border-radius: 10px; font-size: 0.9em; line-height: 1.4; }
  .button { align-self: stretch; text-align: center; background: var(--orange); color: var(--night); font-weight: 700; padding: 0.9em; border-radius: 12px; font-size: 1em; }
  .small { align-self: center; color: var(--offwhite); font-size: 0.8em; margin-top: 0.8em; }
  .nine16 { width: 270px; height: 480px; font-size: 10px; }
  .nine20 { width: 270px; height: 600px; font-size: 10px; }
  .land  { width: 600px; height: 270px; font-size: 10px; }
  .land .ui { flex-direction: row; align-items: center; gap: 24px; }
  .land .ui > div { flex: 1; }
</style>
</head>
<body>
<h1>backdrop-1440x3200.webp, centre-cropped, with the D-14 scrim and sample welcome / home content</h1>
<div class="row">
  <figure>
    <div class="frame nine16">
      <img src="backdrop-1440x3200.webp" alt="">
      <div class="scrim"></div>
      <div class="ui">
        <div><div class="title">Zangbundel</div><div class="version">versie 1.0.0</div></div>
        <div></div>
      </div>
    </div>
    <figcaption>16:9 (1080 × 1920): rows 320–2880 of the frame. Welcome screen.</figcaption>
  </figure>
  <figure>
    <div class="frame nine20">
      <img src="backdrop-1440x3200.webp" alt="">
      <div class="scrim"></div>
      <div class="ui">
        <div><div class="title">Kampvuren in de buurt</div><div class="version">Zoeken naar kampvuren…</div></div>
        <div>
          <div class="panel">Scan de QR-code van de kampvuurleider met de camera-app om mee te zingen.</div>
          <div class="button" style="margin-top:12px">Zelf een kampvuur starten</div>
          <div class="small">Bibliotheek · Instellingen · Over</div>
        </div>
      </div>
    </div>
    <figcaption>20:9 (1080 × 2400 or 1440 × 3200): the full frame. Home screen, nothing in range (D-22).</figcaption>
  </figure>
  <figure>
    <div class="frame land">
      <img src="backdrop-3200x1440.webp" alt="">
      <div class="scrim"></div>
      <div class="ui">
        <div><div class="title">Zangbundel</div><div class="version">versie 1.0.0</div></div>
        <div class="panel">Landscape export backdrop-3200x1440.webp (D-13): the photograph at the right, black at the left where the text sits.</div>
      </div>
    </div>
    <figcaption>Landscape 2400 × 1080: columns 320–2880 of the 3200 × 1440 frame.</figcaption>
  </figure>
</div>
</body>
</html>
