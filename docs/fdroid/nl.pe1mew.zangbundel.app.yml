# F-Droid build metadata for Zangbundel: the file that goes into a fork of
# https://gitlab.com/fdroid/fdroiddata as metadata/nl.pe1mew.zangbundel.app.yml (docs/FDROID-RUNBOOK.md Step 8).
# Set to 0.2.0 on 2026-10-28, the owner's decision to submit with 0.2.0 rather than the production release; for
# every later release set the Builds entry and CurrentVersion to its tag commit. Store texts and graphics are not here: F-Droid reads them from
# fastlane/metadata/android/ in the source repository at the tag.
Categories:
  - Lyrics
  - Multimedia
License: Apache-2.0
AuthorName: Remko Welling
AuthorEmail: zangbundel@rfsee.nl
WebSite: https://github.com/pe1mew/Zangbundel
SourceCode: https://github.com/pe1mew/Zangbundel
IssueTracker: https://github.com/pe1mew/Zangbundel/issues
Changelog: https://github.com/pe1mew/Zangbundel/blob/main/changelog.md

AutoName: Zangbundel

RepoType: git
Repo: https://github.com/pe1mew/Zangbundel.git
# The owner-signed APK of each release (option B): F-Droid builds the tag, copies this APK's signature onto
# its own build and publishes the owner's APK when the two are identical apart from the signature.
Binaries: https://github.com/pe1mew/Zangbundel/releases/download/v%v/zangbundel-%v.apk

Builds:
  - versionName: 0.2.0
    versionCode: 2026102801
    commit: 27d03a4b0b6854f90e907c25e4e13861ca4f1c62
    subdir: android/app
    # The build asks Gradle for a JDK 17 toolchain, as CI uses; the buildserver is Debian 13, which has only
    # JDK 21, so JDK 17 comes from Debian 12 as in other recipes.
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    gradle:
      - yes

AllowedAPKSigningKeys: 57867b3fc14d1f35f63840a841bb05f6ddfda9c36dc058295f87f546a2c89b10

AutoUpdateMode: Version
# Release tags are v<major>.<minor>.<patch> with at most three digits for the major number, which leaves out
# tags in the library's date form, such as v2026.10.2 on an app commit.
UpdateCheckMode: Tags ^v[0-9]{1,3}\.[0-9]+\.[0-9]+$
CurrentVersion: 0.2.0
CurrentVersionCode: 2026102801
