# CI per design/architecture.md section 9: design check, unit tests and lint, unsigned release APK. No secrets.
name: android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Design consistency check
        run: bash scripts/check-design.sh
      - name: Store metadata in step
        run: bash scripts/store-metadata.sh --check
      - name: Translations (docs/TRANSLATING.md)
        run: python3 scripts/check-translation.py all
      - name: Translation check catches its mistakes
        run: python3 scripts/test-check-translation.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon check
      - name: Unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
      # The review build (docs/TRANSLATING.md section 6): the debug build, with the languages under review,
      # signed with a throwaway debug key; it installs next to the store app. Never published as a release.
      - name: Review build with the languages under review
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zangbundel-review-build
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
